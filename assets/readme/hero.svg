<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">播客图解 Podcast Atlas — 把长故事，读成一张清晰的地图</title>
  <desc id="desc">暖纸底横幅：播客图解，副标题把长故事读成一张清晰的地图；右侧是一张知识地图示意：五个节点由连线串成时间线，节点间还有因果连线，象征时间线、人物关系与因果链；底部是 329 已整理单集、510 单集总数、12 深度专题三个标签。</desc>

  <rect width="1200" height="360" rx="26" fill="#f6f1e7"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="18" letter-spacing="3" fill="#1f4d3a">PODCAST ATLAS · 播客图解</text>
    <text x="56" y="134" font-size="62" font-weight="700" fill="#2b2622">播客图解</text>
    <text x="56" y="172" font-size="22" fill="#4a443c">把长故事，读成一张清晰的地图。</text>
    <text x="56" y="210" font-size="19" fill="#6f675c">半拿铁 × 知行小酒馆的中文图文知识库</text>
    <text x="56" y="240" font-size="18" fill="#6f675c">按专题阅读：时间线、人物关系、因果链与中文漫画幻灯片。</text>
    <g id="chips" font-size="18" fill="#2b2622" text-anchor="middle">
      <g><rect x="56" y="266" width="150" height="36" rx="18" fill="#efe6d4" stroke="#d8cbb2" stroke-width="1.5"/><text x="131" y="290">329 已整理单集</text></g>
      <g><rect x="218" y="266" width="150" height="36" rx="18" fill="#efe6d4" stroke="#d8cbb2" stroke-width="1.5"/><text x="293" y="290">510 单集总数</text></g>
      <g><rect x="380" y="266" width="130" height="36" rx="18" fill="#efe6d4" stroke="#d8cbb2" stroke-width="1.5"/><text x="445" y="290">12 深度专题</text></g>
    </g>
  </g>

  <g id="knowledge-map" stroke="#1f4d3a" stroke-width="3" fill="none">
    <path d="M 760 110 C 830 60, 880 170, 950 120 S 1060 90, 1100 150" stroke-linecap="round" opacity="0.55"/>
    <path d="M 800 260 C 870 220, 930 290, 1010 250" stroke-linecap="round" opacity="0.55"/>
    <path d="M 950 120 L 930 250" stroke-dasharray="6 6" opacity="0.4"/>
    <g stroke="none">
      <circle cx="760" cy="110" r="26" fill="#1f4d3a"/><circle cx="760" cy="110" r="10" fill="#f6f1e7"/>
      <circle cx="880" cy="140" r="20" fill="#3a7a5c"/><circle cx="880" cy="140" r="7" fill="#f6f1e7"/>
      <circle cx="950" cy="120" r="30" fill="#c98a2d"/><circle cx="950" cy="120" r="11" fill="#f6f1e7"/>
      <circle cx="1100" cy="150" r="22" fill="#1f4d3a"/><circle cx="1100" cy="150" r="8" fill="#f6f1e7"/>
      <circle cx="800" cy="260" r="22" fill="#3a7a5c"/><circle cx="800" cy="260" r="8" fill="#f6f1e7"/>
      <circle cx="930" cy="250" r="26" fill="#1f4d3a"/><circle cx="930" cy="250" r="10" fill="#f6f1e7"/>
      <circle cx="1010" cy="250" r="18" fill="#c98a2d"/><circle cx="1010" cy="250" r="6" fill="#f6f1e7"/>
    </g>
    <g stroke="none" opacity="0.9">
      <rect x="740" y="300" width="120" height="10" rx="5" fill="#d8cbb2"/>
      <rect x="880" y="300" width="80" height="10" rx="5" fill="#d8cbb2"/>
      <rect x="980" y="300" width="100" height="10" rx="5" fill="#d8cbb2"/>
    </g>
  </g>
</svg>
